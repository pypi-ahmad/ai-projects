[project]
name = "structured-output-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic[email]>=2.13.5",
    "streamlit>=1.63.0",
]

# Flat src/ layout: engine/schemas/providers/eval/ui are independent
# top-level packages (not nested under one wrapper package), so `python -m
# src.engine` works when run from the project root and `import engine` /
# `import schemas` / `import providers` work once installed.
[tool.uv.build-backend]
module-name = ["engine", "schemas", "providers", "eval", "ui"]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
