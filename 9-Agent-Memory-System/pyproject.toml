[project]
name = "memory"
version = "0.1.0"
description = "Working + episodic + semantic memory for agents: compression and eviction, local-first on Windows."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "streamlit>=1.63.0",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
