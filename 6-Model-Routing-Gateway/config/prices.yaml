# Per-model cost rates for estimation.
# Formula: cost = (in_tokens / 1000) * in_per_1k + (out_tokens / 1000) * out_per_1k
# currency: USD
# unit: tokens (not characters)
#
# All non-zero values are labeled "estimate" — config numbers, not invoice data.
# Replace with current vendor pricing when accuracy matters.
# If a model is absent from this file: cost=null and event is flagged UNPRICED.

currency: USD
unit: tokens

models:
  # ── Ollama (local) ── rates are 0; electricity not metered by default ─────
  qwen3.5:0.8b:
    provider: ollama
    in_per_1k: 0.0
    out_per_1k: 0.0

  qwen3.5:2b:
    provider: ollama
    in_per_1k: 0.0
    out_per_1k: 0.0

  qwen3-vl:2b:
    provider: ollama
    in_per_1k: 0.0
    out_per_1k: 0.0

  granite4.1:3b:
    provider: ollama
    in_per_1k: 0.0
    out_per_1k: 0.0

  qwen3-embedding:0.6b:
    provider: ollama
    in_per_1k: 0.0
    out_per_1k: 0.0

  qwen3-embedding:4b:
    provider: ollama
    in_per_1k: 0.0
    out_per_1k: 0.0

  translategemma:4b:
    provider: ollama
    in_per_1k: 0.0
    out_per_1k: 0.0

  AuditAid/PaddleOCR-VL-1.6-0.9B:
    provider: ollama
    in_per_1k: 0.0
    out_per_1k: 0.0

  # ── Agnes AI ─────────────────────────────────────────────────────────────
  # agnes-2.5-flash: no public list price; using comparable flash-tier estimate
  agnes-2.5-flash:
    provider: agnes
    in_per_1k: 0.0003   # estimate — ~$0.30 / 1M input tokens
    out_per_1k: 0.0006  # estimate — ~$0.60 / 1M output tokens

  # ── OpenAI-compatible ─────────────────────────────────────────────────────
  # gpt-5.6-luna / gpt-5.6-terra: custom endpoint; no public list price
  gpt-5.6-luna:
    provider: openai
    in_per_1k: 0.0005   # estimate — ~$0.50 / 1M input tokens
    out_per_1k: 0.0015  # estimate — ~$1.50 / 1M output tokens

  gpt-5.6-terra:
    provider: openai
    in_per_1k: 0.0003   # estimate — ~$0.30 / 1M input tokens
    out_per_1k: 0.0009  # estimate — ~$0.90 / 1M output tokens

  # ── Gemini ────────────────────────────────────────────────────────────────
  # gemini-3.x series: not publicly announced; estimates based on 2.x pricing
  gemini-3.5-flash-lite:
    provider: gemini
    in_per_1k: 0.000075  # estimate — ~$0.075 / 1M input tokens
    out_per_1k: 0.0003   # estimate — ~$0.30 / 1M output tokens

  gemini-3.7-flash:
    provider: gemini
    in_per_1k: 0.0001   # estimate — ~$0.10 / 1M input tokens
    out_per_1k: 0.0004  # estimate — ~$0.40 / 1M output tokens
