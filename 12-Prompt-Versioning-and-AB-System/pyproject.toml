[project]
name = "promptreg"
version = "0.1.0"
description = "Prompt/config registry with rollback, traffic splitting, and outcome tracking"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "streamlit>=1.63.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
# TC00x: pydantic needs real (not TYPE_CHECKING-only) imports to resolve annotations at runtime.
ignore = ["D", "COM812", "ISC001", "CPY001", "TC001", "TC002", "TC003"]

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "INP001", "PLR2004", "S105"]
"**/__main__.py" = ["T201"]
"scripts/*" = ["T201", "INP001", "S311", "PLR2004"]

[tool.ty.environment]
python-version = "3.13"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
