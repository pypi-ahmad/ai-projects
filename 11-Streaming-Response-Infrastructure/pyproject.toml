[project]
name = "stream"
version = "0.1.0"
description = "SSE streaming infrastructure: backpressure, reconnect, TTFT/inter-token timing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "streamlit>=1.63.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
