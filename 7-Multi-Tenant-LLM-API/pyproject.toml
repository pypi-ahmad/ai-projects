[project]
name = "7-multi-tenant-llm-api"
version = "0.1.0"
description = "Multi-tenant LLM gateway API"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "ollama>=0.6.2",
    "openai>=3.13.0",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.63.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
