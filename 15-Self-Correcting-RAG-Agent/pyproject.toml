[project]
name = "self-correcting-rag"
version = "0.1.0"
description = "Self-correcting RAG agent: rewrite, retrieve, critique, fallback-or-abstain, cited answer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bm25s>=0.3.11",
    "google-genai>=2.23.0",
    "ollama>=0.6.2",
    "openai>=3.13.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.19.0",
    "streamlit>=1.63.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.13"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
